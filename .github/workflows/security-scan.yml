name: Security & Vulnerability Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly security audit every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  python-security-audit:
    name: Python Dependency Security Audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Scan Backend Requirements
        run: |
          if [ -f backend/requirements.txt ]; then
            pip-audit -r backend/requirements.txt
          fi

      - name: Scan AI Requirements
        run: |
          if [ -f ai/requirements.txt ]; then
            pip-audit -r ai/requirements.txt
          fi

  node-security-audit:
    name: Node Dependency Security Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Mobile Frontend Dependencies
        run: |
          cd frontend/mobile
          if [ -f package.json ]; then
            npm audit --audit-level=high || echo "High severity vulnerabilities detected in mobile dependencies."
          fi

      - name: Audit Doctor Dashboard Frontend Dependencies
        run: |
          cd frontend/doctor-dashboard
          if [ -f package.json ]; then
            npm audit --audit-level=high || echo "High severity vulnerabilities detected in doctor dashboard dependencies."
          fi
