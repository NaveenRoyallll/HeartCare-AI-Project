name: Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'ai/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'ai/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-and-lint:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install ruff pytest pytest-asyncio httpx

      - name: Run Ruff Linter & Code Formatting Check
        run: |
          ruff check backend/ ai/
          ruff format --check backend/ ai/

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_for_ci_environment_only_do_not_use_in_prod
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          cd backend
          pytest tests/ -v --maxfail=1

      - name: Run AI Module Pytest Suite
        run: |
          cd ai
          if [ -d "tests" ]; then pytest tests/ -v; fi
