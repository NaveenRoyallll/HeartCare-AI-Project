global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alert_rules.yml"

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # CardioGuard AI Backend Service
  - job_name: "cardioguard-backend"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "backend-api-production"

  # Nginx Reverse Proxy Exporter (Optional)
  - job_name: "cardioguard-nginx"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["nginx-exporter:9113"]
